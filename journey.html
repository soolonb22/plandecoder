<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Decoder — Guided Journey with Ollie</title>
<meta name="description" content="Interactive NDIS guided journey with Ollie. Early Childhood pathway, eligibility support, and preparation tools. Privacy-first.">
<style>
  :root {
    --ndis-purple: #6B2976;
    --ndis-purple-dark: #4A1C52;
    --ndis-purple-soft: #F3EAF5;
    --ndis-teal: #009EAD;
    --ndis-teal-soft: #E0F5F7;
    --ndis-green: #8AC640;
    --bg: #FAF8FC;
    --card: #FFFFFF;
    --text: #2A2430;
    --muted: #5C5668;
    --border: #E5DFEA;
    --radius: 16px;
    --shadow: 0 4px 20px rgba(107, 41, 118, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
  }
  :focus-visible { outline: 3px solid var(--ndis-teal); outline-offset: 2px; }

  /* Header */
  .topbar {
    background: var(--ndis-purple-dark);
    color: #fff;
    padding: 0 20px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: -0.3px;
    text-decoration: none;
    color: #fff;
  }
  .logo span { color: #7FD8DF; }
  .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
  .pill {
    background: rgba(255,255,255,0.15);
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 600;
  }

  /* Layout */
  .app-shell {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 58px);
  }
  @media (max-width: 860px) {
    .app-shell { grid-template-columns: 1fr; }
    .avatar-panel { order: 2; border-top: 1px solid var(--border); }
  }

  /* Avatar Panel */
  .avatar-panel {
    background: linear-gradient(180deg, var(--ndis-purple-soft) 0%, #fff 100%);
    border-right: 1px solid var(--border);
    padding: 24px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .ollie-wrap {
    position: relative;
    width: 100%;
    max-width: 200px;
    margin-bottom: 14px;
  }
  .ollie-img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 16px;
  }

  /* Emotional states — mainly affect speech bubble; avatar uses idle/speaking animations */
  .ollie-wrap.listening .ollie-img {
    filter: brightness(1.03);
  }
  .ollie-wrap.calm .ollie-img {
    filter: brightness(1.05) saturate(0.93);
  }

  .speech-bubble {
    background: #fff;
    border: 2px solid var(--ndis-purple);
    border-radius: 18px;
    padding: 14px 16px;
    font-size: 0.95rem;
    line-height: 1.45;
    position: relative;
    box-shadow: var(--shadow);
    max-width: 100%;
    transition: border-color 0.4s ease,
                background 0.4s ease,
                box-shadow 0.4s ease;
  }
  .speech-bubble::after {
    content: "";
    position: absolute;
    top: -10px;
    left: 30px;
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 10px solid var(--ndis-purple);
    transition: border-bottom-color 0.4s ease;
  }

  .speech-bubble.listening {
    border-color: var(--ndis-teal);
    box-shadow: 0 4px 18px rgba(0, 158, 173, 0.13);
  }
  .speech-bubble.listening::after {
    border-bottom-color: var(--ndis-teal);
  }
  .speech-bubble.encouraging {
    border-color: var(--ndis-green);
    background: #F7FBF0;
    box-shadow: 0 4px 18px rgba(138, 198, 64, 0.16);
  }
  .speech-bubble.encouraging::after {
    border-bottom-color: var(--ndis-green);
  }
  .speech-bubble.calm {
    border-color: #7EB8C0;
    background: #F0F9FA;
    box-shadow: 0 4px 16px rgba(126, 184, 192, 0.13);
  }
  .speech-bubble.calm::after {
    border-bottom-color: #7EB8C0;
  }

  .speech-bubble .name {
    font-weight: 800;
    color: var(--ndis-purple);
    font-size: 0.8rem;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }

  /* Smooth text fade during mood change */
  #speechText {
    transition: opacity 0.22s ease;
  }
  .speech-bubble.fading #speechText {
    opacity: 0.3;
  }
  .avatar-controls {
    margin-top: auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .calm-btn, .voice-btn {
    width: 100%;
    background: var(--ndis-teal-soft);
    border: 1px solid var(--ndis-teal);
    color: var(--ndis-teal);
    font-weight: 700;
    padding: 11px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .calm-btn:hover, .voice-btn:hover { background: #d0eef1; }
  .voice-btn.muted {
    background: #f0f0f0;
    border-color: #ccc;
    color: #777;
  }

  /* Lively speaking animation for the clipboard character */
  @keyframes speakingBounce {
    0%, 100% { transform: scale(1.02) translateY(0) rotate(0deg); }
    20% { transform: scale(1.06) translateY(-4px) rotate(-1.5deg); }
    40% { transform: scale(1.04) translateY(-1px) rotate(1deg); }
    60% { transform: scale(1.07) translateY(-5px) rotate(-1deg); }
    80% { transform: scale(1.03) translateY(-2px) rotate(0.8deg); }
  }
  .ollie-wrap.speaking .ollie-img {
    animation: speakingBounce 0.85s ease-in-out infinite;
    transform-origin: center bottom;
  }

  /* Gentle idle bob so he feels alive even when not speaking */
  @keyframes idleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .ollie-wrap:not(.speaking) .ollie-img {
    animation: idleBob 3.2s ease-in-out infinite;
  }

  /* Main content */
  .main-panel {
    padding: 28px 24px 60px;
    max-width: 720px;
  }
  .progress-bar {
    height: 6px;
    background: #E8E0ED;
    border-radius: 4px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ndis-teal), var(--ndis-purple));
    transition: width 0.35s ease;
  }
  .step-label {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 22px;
    font-weight: 600;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 24px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .card h1 {
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--ndis-purple-dark);
    margin-bottom: 10px;
    line-height: 1.25;
  }
  .card h2 {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--ndis-purple-dark);
    margin-bottom: 8px;
  }
  .card p { color: var(--muted); margin-bottom: 14px; font-size: 0.98rem; }

  .privacy-note {
    background: var(--ndis-teal-soft);
    border: 1px solid #B8E4E9;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 0.9rem;
    color: #0B5259;
    margin-bottom: 18px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .path-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 8px;
  }
  @media (max-width: 520px) { .path-grid { grid-template-columns: 1fr; } }

  .path-card {
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    cursor: pointer;
    transition: all 0.2s;
    background: #fff;
    text-align: left;
  }
  .path-card:hover {
    border-color: var(--ndis-teal);
    background: var(--ndis-teal-soft);
  }
  .path-card.selected {
    border-color: var(--ndis-purple);
    background: var(--ndis-purple-soft);
  }
  .path-card strong {
    display: block;
    font-size: 1.02rem;
    color: var(--ndis-purple-dark);
    margin-bottom: 4px;
  }
  .path-card span {
    font-size: 0.86rem;
    color: var(--muted);
  }

  .choice-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
  }
  .choice-btn {
    border: 2px solid var(--border);
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    font-size: 0.97rem;
    font-weight: 600;
    color: var(--text);
    transition: all 0.15s;
  }
  .choice-btn:hover {
    border-color: var(--ndis-teal);
    background: var(--ndis-teal-soft);
  }
  .choice-btn.selected {
    border-color: var(--ndis-purple);
    background: var(--ndis-purple-soft);
  }

  .nav-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 22px;
  }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 13px 22px;
    font-weight: 700;
    font-size: 0.97rem;
    cursor: pointer;
  }
  .btn-back {
    background: #fff;
    border: 2px solid var(--border);
    color: var(--muted);
  }
  .btn-primary {
    background: var(--ndis-purple);
    color: #fff;
  }
  .btn-primary:hover { background: var(--ndis-purple-dark); }
  .btn-teal {
    background: var(--ndis-teal);
    color: #fff;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 6px;
    color: var(--ndis-purple-dark);
  }
  .field input, .field textarea, .field select {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 1rem;
    background: #fff;
  }
  .field input:focus, .field textarea:focus {
    border-color: var(--ndis-teal);
    outline: none;
  }
  .field textarea { min-height: 90px; resize: vertical; }

  .result-box {
    background: var(--ndis-purple-soft);
    border-radius: 12px;
    padding: 18px;
    margin-top: 12px;
  }
  .result-box h3 {
    font-size: 1.05rem;
    color: var(--ndis-purple-dark);
    margin-bottom: 8px;
  }

  .disclaimer {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 20px;
    line-height: 1.5;
  }

  /* Calm Corner */
  .calm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42, 36, 48, 0.55);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .calm-overlay.open { display: flex; }
  .calm-card {
    background: #fff;
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .calm-card h2 { color: var(--ndis-purple-dark); margin-bottom: 12px; }
  .calm-card p { color: var(--muted); margin-bottom: 18px; }
  .breath-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: var(--ndis-teal-soft);
    border: 4px solid var(--ndis-teal);
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: var(--ndis-teal);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
</style>
</head>

/* ========== OLLIE SPEECH ========== */

/* ========== VOICE SYSTEM (Phase 1) ========== */
let voiceEnabled = true;
let preferredVoice = null;
let availableVoices = [];
let speakQueue = [];
let isSpeaking = false;

function scoreVoice(v) {
  const name = (v.name || '').toLowerCase();
  const lang = (v.lang || '').toLowerCase().replace('_', '-');
  let score = 0;

  // Language preference
  if (lang === 'en-au') score += 100;
  else if (lang.startsWith('en-au')) score += 90;
  else if (lang === 'en-gb') score += 70;
  else if (lang.startsWith('en-gb')) score += 65;
  else if (lang.startsWith('en')) score += 40;
  else return -1; // discard non-English

  // Quality indicators
  if (name.includes('natural') || name.includes('neural') || name.includes('enhanced')) score += 30;
  if (name.includes('google') || name.includes('microsoft') || name.includes('samantha') || name.includes('karen') || name.includes('lee') || name.includes('catherine')) score += 15;
  if (name.includes('australian') || name.includes('australia')) score += 25;
  if (v.localService === false) score += 10; // often higher quality cloud voices

  // Penalise novelty / low quality
  if (name.includes('novelty') || name.includes('whisper') || name.includes('zarvox') || name.includes('trinoids')) score -= 50;

  return score;
}

function loadVoices() {
  const voices = speechSynthesis.getVoices() || [];
  availableVoices = voices
    .map(v => ({ voice: v, score: scoreVoice(v) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score);

  // Restore previously chosen voice if still available
  const savedName = localStorage.getItem('pd_voice_name');
  if (savedName) {
    const found = availableVoices.find(x => x.voice.name === savedName);
    if (found) preferredVoice = found.voice;
  }

  if (!preferredVoice && availableVoices.length) {
    preferredVoice = availableVoices[0].voice;
  }

  // Refresh the voice chooser if it is open
  const select = document.getElementById('voiceSelect');
  if (select) populateVoiceSelect(select);
}

if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function stopSpeaking() {
  speakQueue = [];
  isSpeaking = false;
  if (typeof speechSynthesis !== 'undefined' && speechSynthesis.speaking) {
    speechSynthesis.cancel();
  }
  const wrap = document.getElementById('ollieWrap');
  if (wrap) wrap.classList.remove('speaking');
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById('voiceBtn');
  if (voiceEnabled) {
    btn.textContent = '🔊 Voice On';
    btn.classList.remove('muted');
  } else {
    btn.textContent = '🔇 Voice Off';
    btn.classList.add('muted');
    stopSpeaking();
  }
  try { localStorage.setItem('pd_voice', voiceEnabled ? '1' : '0'); } catch(e) {}
}

// Restore voice on/off preference
try {
  if (localStorage.getItem('pd_voice') === '0') {
    voiceEnabled = false;
    setTimeout(() => {
      const btn = document.getElementById('voiceBtn');
      if (btn) {
        btn.textContent = '🔇 Voice Off';
        btn.classList.add('muted');
      }
    }, 80);
  }
} catch(e) {}

function splitIntoNaturalChunks(text) {
  // Split on sentence endings while keeping the punctuation
  const parts = text.match(/[^.!?]+[.!?]+[\s]*/g) || [text];
  return parts.map(p => p.trim()).filter(Boolean);
}

function speakChunk(text, onEnd) {
  if (!voiceEnabled || !('speechSynthesis' in window)) {
    if (onEnd) onEnd();
    return;
  }

  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.93;
  utter.pitch = 1.04;
  utter.volume = 1;
  if (preferredVoice) utter.voice = preferredVoice;

  const wrap = document.getElementById('ollieWrap');

  utter.onstart = () => {
    isSpeaking = true;
    if (wrap) wrap.classList.add('speaking');
  };
  utter.onend = () => {
    isSpeaking = false;
    if (wrap) wrap.classList.remove('speaking');
    if (onEnd) onEnd();
  };
  utter.onerror = () => {
    isSpeaking = false;
    if (wrap) wrap.classList.remove('speaking');
    if (onEnd) onEnd();
  };

  speechSynthesis.speak(utter);
}

function processQueue() {
  if (speakQueue.length === 0) {
    isSpeaking = false;
    const wrap = document.getElementById('ollieWrap');
    if (wrap) wrap.classList.remove('speaking');
    return;
  }
  const next = speakQueue.shift();
  speakChunk(next, () => {
    // Small natural pause between sentences
    setTimeout(processQueue, 280);
  });
}

function speak(key) {
  const entry = messages[key] || messages.placeholder;
  const text = typeof entry === 'string' ? entry : entry.text;
  const mood = typeof entry === 'string' ? 'talking' : (entry.mood || 'talking');

  const bubble = document.getElementById('speechBubble');
  const wrap = document.getElementById('ollieWrap');
  const textEl = document.getElementById('speechText');

  stopSpeaking();

  bubble.classList.add('fading');

  setTimeout(() => {
    textEl.textContent = text;

    wrap.classList.remove('talking', 'talking-enter', 'listening', 'encouraging', 'calm', 'speaking');
    bubble.classList.remove('listening', 'encouraging', 'calm', 'fading');

    wrap.classList.add(mood);
    if (mood !== 'talking') {
      bubble.classList.add(mood);
    }

    if (voiceEnabled && 'speechSynthesis' in window) {
      const chunks = splitIntoNaturalChunks(text);
      speakQueue = chunks;
      processQueue();
    }
  }, 180);
}

function populateVoiceSelect(select) {
  select.innerHTML = '';
  if (!availableVoices.length) {
    const opt = document.createElement('option');
    opt.textContent = 'No voices available yet';
    select.appendChild(opt);
    return;
  }
  availableVoices.forEach(({ voice, score }) => {
    const opt = document.createElement('option');
    opt.value = voice.name;
    const langLabel = voice.lang ? ` (${voice.lang})` : '';
    opt.textContent = voice.name + langLabel;
    if (preferredVoice && preferredVoice.name === voice.name) opt.selected = true;
    select.appendChild(opt);
  });
}

function changeVoice(name) {
  const found = availableVoices.find(x => x.voice.name === name);
  if (found) {
    preferredVoice = found.voice;
    try { localStorage.setItem('pd_voice_name', name); } catch(e) {}

    const text = document.getElementById('speechText')?.textContent;
    if (text && voiceEnabled) {
      stopSpeaking();
      speakQueue = splitIntoNaturalChunks(text);
      processQueue();
    }
  }
}

  document.body.appendChild(panel);

  populateVoiceSelect(select);
  select.onchange = () => changeVoice(select.value);
}

      </div>
    `;
  }
}

/* ========== ACTIONS ========== */
function go(step) {
  stopSpeaking();
  state.step = step;
  save();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function acceptConsent() {
  const checked = document.getElementById('consentCheck')?.checked;
  if (!checked) {
    alert('Please confirm you understand before continuing.');
    return;
  }
  state.consent = true;
  go('path');
}

function selectPath(p) {
  state.path = p;
  save();
  render();
}

function startPath() {
  if (!state.path) return;
  if (state.path === 'ec') go('ec_intro');
  else go('other');
}

function setAge(g) {
  state.ageGroup = g;
  save();
  render();
}

function afterAge() {
  if (state.ageGroup === 'redirect') go('redirect');
  else go('ec_early');
}

function setEarly(v) {
  state.earlyEnough = v;
  save();
  render();
}

function afterEarly() {
  if (state.earlyEnough === 'yes') go('ec_mainstream');
  else go('ec_elig');
}

function saveGoals() {
  state.goalsText = document.getElementById('goalsText')?.value || '';
  save();
  go('ec_report');
}

function restart() {
  if (confirm('Start over? Current progress will be cleared.')) {
    state = { step: 'start', path: null, ageGroup: null, earlyEnough: null, likelihood: null, childName: '', goalsText: '', consent: false };
    save();
    render();
  }
}

function openCalm() {
  stopSpeaking();
  speak('calm');
  document.getElementById('calmOverlay').classList.add('open');
}
function closeCalm() {
  stopSpeaking();
  document.getElementById('calmOverlay').classList.remove('open');
  // Restore the speech for the current step
  render();
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ========== INIT ========== */
load();
render();
</script>

</html>
